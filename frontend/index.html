<!doctype html><html lang="vi"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Smart Cane Dashboard — Mock</title>
<style>body{font:16px system-ui;margin:0;background:#f5f7fb;color:#182638}header{background:#163a64;color:#fff;padding:24px}main{max-width:1100px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:white;border:1px solid #dce3ed;border-radius:14px;padding:18px}.value{font-size:26px;font-weight:750}#map{height:340px;border-radius:14px;overflow:hidden;background:#e5ebf2;margin-top:14px}.note{color:#526075;font-size:13px}</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" /></head>
<body><header><h1>Smart Cane IoT</h1><p>Dashboard demo — dữ liệu giả, chưa kết nối ESP32 / backend</p></header><main><div class="grid">
<div class="card"><div>Thiết bị</div><div class="value" id="device">cane-01</div></div>
<div class="card"><div>Khoảng cách</div><div class="value" id="distance">—</div></div>
<div class="card"><div>Cảm biến nước</div><div class="value" id="water">—</div></div>
<div class="card"><div>SOS</div><div class="value" id="sos">—</div></div></div>
<div id="map" role="img" aria-label="Bản đồ vị trí mẫu"></div><p class="note">Dữ liệu minh họa: vị trí Hà Nội giả lập. Leaflet cần Internet để tải thư viện và bản đồ nền.</p></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./mock.js"></script></body></html>
